[project]
name = "datamonth3"
version = "0.1.0"
description = "PySpark pipeline over the GBIF occurrence snapshot"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Exact versions this was developed and measured against. uv.lock pins the
    # full transitive tree; these bounds keep a plain `pip install .` close.
    "pyspark==4.2.0",
    "pyarrow==25.0.1",
    # PySpark 4.2 warns that pandas >= 3 is not fully supported, and the
    # pandas-UDF benchmark in day6.py needs to run.
    "pandas>=2.3,<3",
]
